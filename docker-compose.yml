services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sadcatman123
      POSTGRES_DB: gym_bot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    env_file:
      - .env  
    depends_on:
      - db
    command: sh -c "alembic upgrade head && python main.py"

volumes:
  postgres_data: